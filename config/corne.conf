CONFIG_ZMK_KEYBOARD_NAME="PIM Corne"

CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_INVERT=y
# nice_view_gem's custom status screen (v0.3.0) bakes layer/battery/WPM
# display into its own widgets/screen.c and widgets/screen_peripheral.c
# (nice_view's equivalents are widgets/status.c and
# widgets/peripheral_status.c), which define symbols (e.g.
# widget_battery_status_mutex) that collide at link time with the generic
# app/src/display/widgets/*.c files these CONFIG_ZMK_WIDGET_* options would
# force to compile. Neither shield reads these options, so they are left
# unset rather than forced on.

# mouse config
CONFIG_ZMK_POINTING=y

# Uncomment the following line to increase the keyboard's wireless range
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# show animation at 30fps
# CONFIG_NICE_VIEW_GEM_ANIMATION_MS=1920
# show animation at 60fps
# CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# https://github.com/mctechnology17/zmk-nice-oled?tab=readme-ov-file#configuration
# CONFIG_NICE_OLED_GRAPH_AND_NEEDLE_WPM_FIXED_RANGE=y
# CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y