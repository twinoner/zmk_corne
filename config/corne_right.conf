CONFIG_ZMK_MOUSE=y
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_ZMK_SENSOR_PIM447=y
CONFIG_ZMK_KEYBOARD_NAME="DS87"
