# The PIM447 trackball is on the right half, so the right half must be the
# split CENTRAL.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="DS87"

# NOTE: the trackball driver is enabled by the pim447_corne shield, in
# boards/shields/pim447_corne/Kconfig.defconfig. Do not set CONFIG_ZMK_MOUSE or
# CONFIG_ZMK_SENSOR_PIM447 here - neither symbol exists. ZMK main calls this
# CONFIG_ZMK_POINTING, and the driver symbol is CONFIG_ZMK_PIMORONI_PIM447
# (which pulls in I2C and GPIO itself).

# nice-view-gem: the nice_view_gem shield already defaults the status screen to
# CUSTOM, so only the tuning below is needed.
# 30fps -> 1920, 60fps -> 960
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960
