# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
# NOTE: ZMK main uses Zephyr Hardware Model v2. The board `nice_nano_v2` no
# longer exists; the nice!nano v2 is `nice_nano//zmk` (revision 2.0.0 is the
# default). Keep this in sync with `revision:` for zmk in config/west.yml.
include:
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view_gem
    # shield: corne_left nice_view_adapter nice_view
    # shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view_gem pim447_corne
    # shield: corne_right nice_view_adapter nice_view pim447_corne
    # shield: corne_right pim447_corne
  - board: nice_nano//zmk
    shield: settings_reset
